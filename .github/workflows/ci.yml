# CI for arithma — release build + full test suite on the self-hosted fleet
# (Linux/X64, macOS/ARM64, Windows/X64).
#
# First iteration validates runner plumbing; fmt/clippy gates can be added
# once the fleet is proven.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: [self-hosted, Linux]
            py: python3
            bin: arithma
          - name: macos
            os: [self-hosted, macOS]
            py: python3
            bin: arithma
          - name: windows
            os: [self-hosted, Windows]
            py: python
            bin: arithma.exe
    steps:
      - uses: actions/checkout@v4

      # Runner services run with a non-interactive PATH that lacks cargo on
      # the Linux and Windows hosts (macOS already exposes it). Reuse an
      # existing rustup install when present; install once on first run.
      - name: Ensure Rust toolchain (Linux)
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          # The runner service may start steps with HOME unset; rustup then
          # falls back to the passwd entry, so resolve the same directory
          # explicitly instead of trusting $HOME.
          HOME="${HOME:-$(getent passwd "$(id -u)" | cut -d: -f6)}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          cargo --version
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Ensure Rust toolchain (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "$cargoBin\cargo.exe")) {
              Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
              & "$env:RUNNER_TEMP\rustup-init.exe" -y --default-toolchain stable
            }
          }
          Add-Content $env:GITHUB_PATH $cargoBin

      - name: Build (release)
        run: cargo build --release

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests
        env:
          MATH_CALC_MCP: ${{ github.workspace }}/target/release/${{ matrix.bin }}
        run: ${{ matrix.py }} scripts/test_stdio.py
